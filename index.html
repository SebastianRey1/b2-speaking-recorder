<script>
(function(){
'use strict';

const TEST = {
 grammar: [
 ["Choose the correct option: If the company ___ the recommendations earlier, it might have avoided the problem.",["had followed","followed","would follow","has followed"],"A"],
 ["The environmental report ___ by an independent consultant before it was published.",["reviewed","was reviewed","has reviewed","is reviewing"],"B"],
 ["By the end of this year, the team ___ on the project for three years.",["will work","will have worked","has worked","had worked"],"B"],
 ["I suggest that the organization ___ a more detailed risk assessment.",["conduct","conducts","conducted","will conduct"],"A"],
 ["The data were incomplete, ___ the team could not reach a final conclusion.",["although","therefore","despite","unless"],"B"],
 ["She is responsible ___ coordinating communication with local communities.",["to","for","with","at"],"B"],
 ["The project was delayed because some permits ___ yet.",["had not issued","were not issuing","had not been issued","have not issuing"],"C"],
 ["Neither the manager nor the engineers ___ aware of the change at first.",["was","were","has been","is"],"B"],
 ["This is one of the most challenging projects I ___.",["have ever worked on","ever work on","had ever work on","am ever working on"],"A"],
 ["If I ___ more information at the time, I would have made a different decision.",["have","had","had had","would have"],"C"],
 ["The samples need ___ before they can be analyzed.",["to label","to be labelled","labeling by","labelled to"],"B"],
 ["The consultant asked whether the measurements ___ taken correctly.",["have been","had been","are","will be"],"B"],
 ["We should take action now, ___ the situation may become more difficult to manage.",["otherwise","because","despite","whereas"],"A"],
 ["The new procedure is intended to make the process more ___.",["efficiency","efficient","efficiently","efficiencies"],"B"],
 ["I am used to ___ with different stakeholders and priorities.",["work","working","have worked","be working"],"B"],
 ["The proposal was rejected, ___ surprised the entire team.",["that","what","which","where"],"C"],
 ["Not only ___ the deadline, but they also improved the quality of the report.",["they met","did they meet","they have met","have they meet"],"B"],
 ["She explained the issue clearly so that everyone ___ the potential consequences.",["understand","understood","will understand","would understand"],"B"],
 ["The equipment is reliable, provided that it ___ regularly.",["maintains","is maintained","will maintain","has maintaining"],"B"],
 ["I would rather ___ the issue now than wait until it becomes more serious.",["discuss","discussed","to discuss","discussing"],"A"]
 ],
 vocabulary: [
 ["The main purpose of the meeting was to ___ a solution that everyone could accept.",["reach","catch","take","hold"],"A"],
 ["The company introduced new measures to ___ the amount of waste produced.",["reduce","remove","destroy","avoid from"],"A"],
 ["A good project manager must be able to ___ priorities when resources are limited.",["set","place","make","put"],"A"],
 ["The consultant raised several ___ about the possible impact on groundwater.",["concerns","orders","manners","notices"],"A"],
 ["The results were not ___ enough to support a final decision.",["sufficient","sensible","sensitive","suitablely"],"A"],
 ["The team had to ___ with local authorities before starting the work.",["coordinate","combine","calculate","collect"],"A"],
 ["The company is trying to improve its environmental ___.",["performance","performer","performing","formation"],"A"],
 ["The contamination was ___ to a relatively small area.",["limited","restricted by","closed","short"],"A"],
 ["We need to take a more ___ approach instead of reacting only when problems occur.",["proactive","previous","preventive from","productive"],"A"],
 ["The proposal was accepted ___ several minor modifications.",["subject to","because of","instead of","apart from"],"A"],
 ["The manager asked for a ___ explanation of the unexpected results.",["thorough","deeply","strongly","wide"],"A"],
 ["The organization wants to ___ awareness of sustainable practices.",["raise","rise","lift up","increase up"],"A"],
 ["The final decision will depend ___ the results of the investigation.",["on","of","from","with"],"A"],
 ["The new system should help ___ the risk of human error.",["minimize","decrease from","shorten","avoid of"],"A"],
 ["Several stakeholders were invited to ___ their views.",["share","divide","deliver","spread"],"A"],
 ["The team must ___ the potential risks before work begins.",["assess","assure","assume","assign"],"A"],
 ["The company has made a long-term ___ to reducing its environmental impact.",["commitment","promise of","engagement","connection"],"A"],
 ["The report highlights the need for greater ___ between different departments.",["collaboration","competition","contribution","combination"],"A"],
 ["The engineer was asked to ___ the cause of the equipment failure.",["identify","recognize to","notice about","detect from"],"A"],
 ["The project was successful largely because the team could ___ to unexpected changes.",["adapt","adopt","adjust with","fit in"],"A"]
 ],
 reading: [
  {title:"Passage 1 — Community and Environmental Projects", text:`A renewable energy company planned to build a small solar facility near a rural community. Although the project promised new jobs and cleaner energy, some residents were worried about changes to the landscape and possible effects on local wildlife. Instead of continuing without consultation, the company organized several meetings and invited independent specialists to explain the environmental studies.

During these meetings, residents suggested changes to the location of an access road and requested regular monitoring of wildlife. The company accepted some of these recommendations and published a revised plan. As a result, opposition did not disappear completely, but communication improved and a larger number of residents expressed support for the project.`,
   qs:[
    ["Why were some residents initially concerned?",["They were worried about possible local impacts.","They wanted more expensive electricity.","They opposed all employment opportunities.","They did not know the project existed."],"A"],
    ["What did the company do instead of continuing without consultation?",["It cancelled the project.","It organized meetings and involved specialists.","It moved to another country.","It ignored the environmental studies."],"B"],
    ["What can be inferred about the revised plan?",["It included at least some community recommendations.","It removed all environmental monitoring.","It was written only by residents.","It guaranteed that nobody would oppose the project."],"A"],
    ["What was one result of the consultation process?",["All residents changed their opinion immediately.","Communication improved and support increased.","The company stopped monitoring wildlife.","The access road was never discussed."],"B"],
    ["Which word best describes the company's approach?",["Collaborative","Secretive","Unplanned","Aggressive"],"A"]
   ]},
  {title:"Passage 2 — Water Monitoring", text:`A regional water authority recently expanded its monitoring program after several communities reported changes in water quality. At first, officials considered the reports isolated incidents. However, additional sampling showed that conditions varied significantly depending on rainfall and land use near the river.

The authority has therefore decided to collect data over a longer period before identifying a single cause. According to the lead scientist, short-term measurements can be useful for detecting unusual conditions, but they are not always sufficient for establishing long-term trends. The program will also include public reports explaining the results in non-technical language.`,
   qs:[
    ["Why was the monitoring program expanded?",["Communities reported changes in water quality.","The river had completely disappeared.","Scientists no longer needed data.","Rainfall had stopped permanently."],"A"],
    ["Why will data be collected over a longer period?",["To reduce the number of samples.","To establish long-term trends more reliably.","Because short-term measurements are always useless.","To avoid reporting results to the public."],"B"],
    ["What affected conditions in the river?",["Rainfall and nearby land use.","Only the number of scientists.","The language used in reports.","The age of the equipment alone."],"A"],
    ["What does the lead scientist suggest about short-term measurements?",["They can detect unusual conditions but may not establish long-term trends.","They are more reliable than all long-term data.","They should never be collected.","They are only useful for financial reports."],"A"],
    ["Why will public reports use non-technical language?",["To make the information more accessible.","To hide the scientific findings.","To replace all monitoring.","To avoid collecting evidence."],"A"]
   ]},
  {title:"Passage 3 — Professional Adaptability", text:`When Elena joined an environmental consulting firm, she expected most of her work to involve analyzing data and preparing technical reports. Six months later, the firm won a project that required frequent communication with community representatives, government officials, and private contractors.

At first, Elena found the change challenging because each group had different priorities and levels of technical knowledge. Over time, she learned to adjust her communication style, explain complex information more clearly, and ask questions before making assumptions. Her manager later described this ability to adapt as one of her most valuable professional strengths.`,
   qs:[
    ["What did Elena originally expect her work to involve?",["Mostly data analysis and technical reports.","Only international travel.","Managing the entire company.","Teaching at a university."],"A"],
    ["Why did Elena initially find the new project challenging?",["Different stakeholders had different priorities and knowledge.","She had no technical background.","The project had no manager.","She refused to communicate with others."],"A"],
    ["What did Elena learn to do?",["Adjust her communication style and clarify complex information.","Avoid asking questions.","Use the same explanation for every audience.","Focus only on data."],"A"],
    ["What did her manager consider a valuable strength?",["Her ability to adapt.","Her ability to avoid stakeholders.","Her preference for routine work.","Her speed at typing."],"A"],
    ["What is the main lesson of the passage?",["Professional adaptability can become a valuable skill.","Technical knowledge is never useful.","Projects should avoid communication.","Stakeholders always agree."],"A"]
   ]}
 ],
 listening: [
  {passage:"The project manager announced that the field inspection would be postponed by one week. Recent storms had made several access routes unsafe, and the team did not want to create additional risks for employees or damage the surrounding area. She emphasized that the delay would affect the schedule, but safety and environmental protection had to remain the priority.", qs:[
   ["Why was the inspection postponed?",["Unsafe access routes after recent storms.","The project was permanently cancelled.","The team had finished early.","The equipment was sold."],"A"],
   ["What did the manager consider the priority?",["Safety and environmental protection.","Following the original schedule at any cost.","Reducing the number of employees.","Avoiding communication."],"A"],
   ["What impact would the delay have?",["It would affect the schedule.","It would eliminate all risks permanently.","It would finish the project immediately.","It would reduce the size of the team."],"A"]
  ]},
  {passage:"During a waste audit, the consultant discovered that a large amount of recyclable material was being sent to landfill. She explained that the problem was not a lack of recycling services. Instead, many employees were unsure how to separate different materials correctly. She recommended clearer labels, short training sessions, and regular feedback on the results.", qs:[
   ["What was the main problem?",["Employees were not separating materials correctly.","There were no recycling services.","The landfill was closed.","The audit had no results."],"A"],
   ["What did the consultant recommend?",["Clearer labels, training, and feedback.","Eliminating all recycling.","Hiring only new employees.","Stopping the audit."],"A"],
   ["What can be inferred?",["Improved guidance could reduce unnecessary landfill waste.","Recycling services are unavailable.","Training would make the problem worse.","The organization produces no waste."],"A"]
  ]},
  {passage:"A candidate is describing a university project in an interview. She explains that her original responsibility was to analyze water samples, but halfway through the project one team member became unavailable. The group redistributed the work, and she also took responsibility for coordinating weekly meetings. Although this increased her workload, the project was completed successfully and she learned more about organizing a team.", qs:[
   ["What changed during the project?",["A team member became unavailable.","The project was cancelled.","Water samples disappeared.","The candidate left the university."],"A"],
   ["What additional responsibility did the candidate take?",["Coordinating weekly meetings.","Managing the university.","Hiring new professors.","Writing the entire project alone."],"A"],
   ["What did she learn?",["More about organizing a team.","That teamwork is unnecessary.","How to avoid responsibility.","How to reduce water quality."],"A"]
  ]},
  {passage:"At a public meeting, a representative explained that the organization had received several questions about a proposed conservation area. Some residents supported the idea, while others were concerned about possible restrictions on land use. The representative said that the next stage would include individual consultations because a general presentation was not enough to address every situation.", qs:[
   ["Why were individual consultations planned?",["Different situations required more specific discussion.","The general meeting had no attendees.","The conservation area was already cancelled.","Residents did not have questions."],"A"],
   ["What were some residents concerned about?",["Possible restrictions on land use.","A lack of rainfall.","The cost of electricity.","The quality of internet access."],"A"],
   ["What does the representative imply?",["A single general presentation cannot address every concern.","All residents have identical priorities.","Consultation is unnecessary.","The project is secret."],"A"]
  ]},
  {passage:"A supervisor is giving feedback to an employee who recently prepared an environmental report. She says that the technical analysis is strong and the evidence is well organized. However, she recommends improving the executive summary because senior managers may not have time to read the entire document. The key findings and recommended actions should therefore be easier to identify quickly.", qs:[
   ["What was strong about the report?",["The technical analysis and organization of evidence.","The executive summary only.","Its visual design only.","The length of the title."],"A"],
   ["What should be improved?",["The executive summary.","The environmental evidence.","The employee's attendance.","The entire technical analysis."],"A"],
   ["Why is the executive summary important?",["Senior managers may need to identify key information quickly.","It replaces all evidence.","It is the longest section.","It is only used by students."],"A"]
  ]}
 ],
 speaking:[
  "Introduce yourself. Describe your academic or professional background and explain what type of position you are interested in.",
  "Describe a challenging situation you experienced at work, university, or during a project. Explain the situation, what you did, and the result.",
  "Imagine that you are part of an environmental project and local residents disagree with part of the proposed plan. How would you approach the situation?",
  "What environmental issue do you consider particularly important in your country or region? Explain the problem and suggest possible solutions.",
  "Describe a time when you had to adapt to an unexpected change. What did you learn from the experience?",
  "Why do you believe you would be a suitable candidate for a position as an Environmental Protection Specialist? Refer to relevant skills, knowledge, or personal qualities."
 ],
 writing:[
  {prompt:"Write a professional email to your supervisor explaining that an important environmental task or project may not be completed by the original deadline. Explain the reason, the possible impact, and the solution you propose. Write approximately 150–200 words.",min:130,max:230},
  {prompt:"Write an opinion essay. 'Environmental protection should be a shared responsibility between governments, companies, and citizens.' Do you agree or disagree? Support your opinion with clear reasons and examples. Write approximately 180–250 words.",min:160,max:280}
 ]
};

const state={step:0,candidate:'',startedAt:null,sectionStarted:null,timeLimit:3600,
grammar:[],vocabulary:[],reading:[],listening:[],speaking:[],writing:[],audioBlobs:{},listeningPlays:{},
recorder:null,stream:null,recordingIndex:null,recordSeconds:0,recordTimer:null,countdown:null};

const app=document.getElementById('app');
// Replace this with your GitHub Pages URL after deployment.

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(sec){sec=Math.max(0,sec);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');}
function renderTop(title){return '<div class="topbar"><span><b>'+esc(title)+'</b></span> <span style="float:right">Time remaining: <span id="time" class="time">60:00</span></span></div>';}
function updateTime(){if(!state.startedAt)return;const elapsed=Math.floor((Date.now()-new Date(state.startedAt).getTime())/1000);const left=state.timeLimit-elapsed;const el=document.getElementById('time');if(el)el.textContent=fmt(left);if(left<=0){clearInterval(state.countdown);finishAssessment();}}
function startClock(){clearInterval(state.countdown);updateTime();state.countdown=setInterval(updateTime,1000);}
function speak(text,done){if(!('speechSynthesis'in window)){alert('Audio playback is not supported.');if(done)done();return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.88;u.onend=()=>done&&done();speechSynthesis.speak(u);}
function renderMC(list,prefix){let h='';list.forEach((q,i)=>{h+='<div class="question"><b>'+(i+1)+'. '+esc(q[0])+'</b>';q[1].forEach((o,j)=>{const l=String.fromCharCode(65+j);h+='<label><input type="radio" name="'+prefix+i+'" value="'+l+'"> '+l+'. '+esc(o)+'</label>';});h+='</div>';});return h;}
function collect(prefix,count){const a=[];for(let i=0;i<count;i++){const x=document.querySelector('input[name="'+prefix+i+'"]:checked');a.push(x?x.value:'');}return a;}
function scoreFlat(items,answers){let correct=0;const detail=items.map((q,i)=>{const ok=answers[i]===q[2];if(ok)correct++;return {question:i+1,selected:answers[i]||null,correctAnswer:q[2],correct:ok};});return {correct,total:items.length,percent:Math.round(correct/items.length*100),detail};}
function renderStart(){app.innerHTML='<h1>B2 English Practice Assessment</h1><p class="muted">A 60-minute practice assessment designed around CEFR B2-level language skills and the requirements of an Environmental Protection Specialist role.</p><div class="section-grid"><div><b>Grammar</b><br>20 questions</div><div><b>Vocabulary</b><br>20 questions</div><div><b>Reading</b><br>15 questions</div><div><b>Listening</b><br>15 questions</div><div><b>Speaking</b><br>6 responses</div><div><b>Writing</b><br>2 tasks</div></div><div class="info"><b>Suggested timing:</b> Grammar 8 min · Vocabulary 8 min · Reading 12 min · Listening 12 min · Speaking 12 min · Writing 8 min.<br><br>The full assessment has a maximum duration of <b>60 minutes</b>. This is a practice assessment and not the official SpeakNow examination.</div><label><b>Candidate name</b></label><input id="candidate" type="text" placeholder="Enter full name"><button id="action">Start assessment</button>';document.getElementById('action').onclick=next;}
function renderGrammar(){app.innerHTML=renderTop('Part 1 of 6 — Grammar')+'<h2>Grammar</h2><p class="muted">Choose the best answer for each question.</p>'+renderMC(TEST.grammar,'g')+'<button id="action">Continue to Vocabulary</button>';document.getElementById('action').onclick=next;startClock();}
function renderVocabulary(){app.innerHTML=renderTop('Part 2 of 6 — Vocabulary')+'<h2>Vocabulary</h2><p class="muted">Choose the word or expression that best completes each sentence.</p>'+renderMC(TEST.vocabulary,'v')+'<button id="action">Continue to Reading</button>';document.getElementById('action').onclick=next;startClock();}
function renderReading(){let h=renderTop('Part 3 of 6 — Reading Comprehension')+'<h2>Reading Comprehension</h2><p class="muted">Read each passage and answer the questions.</p>';let n=0;TEST.reading.forEach(p=>{h+='<h3>'+esc(p.title)+'</h3><div class="reading-box">'+esc(p.text)+'</div>';p.qs.forEach(q=>{h+='<div class="question"><b>'+(++n)+'. '+esc(q[0])+'</b>';q[1].forEach((o,j)=>{const l=String.fromCharCode(65+j);h+='<label><input type="radio" name="r'+(n-1)+'" value="'+l+'"> '+l+'. '+esc(o)+'</label>';});h+='</div>';});});h+='<button id="action">Continue to Listening</button>';app.innerHTML=h;document.getElementById('action').onclick=next;startClock();}
function renderListening(){let h=renderTop('Part 4 of 6 — Listening Comprehension')+'<h2>Listening Comprehension</h2><div class="info">Each audio may be played a maximum of <b>two times</b>. The question becomes available after the first playback.</div>';let n=0;TEST.listening.forEach((item,idx)=>{h+='<div class="question"><h3>Listening '+(idx+1)+'</h3><div class="controls"><button class="secondary listen" data-i="'+idx+'">▶ Play audio</button><span id="ls'+idx+'" class="status">2 plays available</span></div><div id="lq'+idx+'" class="hidden">';item.qs.forEach(q=>{h+='<div class="question"><b>'+(++n)+'. '+esc(q[0])+'</b>';q[1].forEach((o,j)=>{const l=String.fromCharCode(65+j);h+='<label><input type="radio" name="l'+(n-1)+'" value="'+l+'"> '+l+'. '+esc(o)+'</label>';});h+='</div>';});h+='</div></div>';});h+='<button id="action">Continue to Speaking</button>';app.innerHTML=h;document.querySelectorAll('.listen').forEach(b=>b.onclick=function(){const i=+this.dataset.i,c=state.listeningPlays[i]||0;if(c>=2)return;state.listeningPlays[i]=c+1;this.disabled=true;this.textContent='Playing...';speak(TEST.listening[i].passage,()=>{document.getElementById('lq'+i).classList.remove('hidden');const left=2-state.listeningPlays[i];this.disabled=left===0;this.textContent=left?'▶ Play again ('+left+' left)':'Played twice';document.getElementById('ls'+i).textContent=left+' plays remaining';});});document.getElementById('action').onclick=next;startClock();}
function renderSpeaking(){
 let h=renderTop('Part 5 of 6 — Speaking')+'<h2>Speaking</h2><p class="muted">Answer each question naturally. Aim for approximately 45–90 seconds per response. You may listen to your recording before continuing.</p><div class="info">Click <b>Enable microphone</b> first. Your browser will show its normal permission prompt.</div><div class="controls"><button id="micrequest">🎙 Enable microphone</button><span id="micstatus" class="status">Microphone permission has not been requested.</span></div>';
 TEST.speaking.forEach((q,i)=>{h+='<div class="question"><b>'+(i+1)+'. '+esc(q)+'</b><div class="controls"><button class="secondary" id="rec'+i+'">● Start recording</button><button class="record" id="stop'+i+'">■ Stop</button><span id="rt'+i+'" class="status">00:00</span></div><div id="rs'+i+'" class="status"></div><audio id="pa'+i+'" controls class="hidden"></audio></div>';});
 h+='<button id="action">Continue to Writing</button>';app.innerHTML=h;
 document.getElementById('micrequest').onclick=requestMic;
 TEST.speaking.forEach((_,i)=>{document.getElementById('rec'+i).onclick=()=>startRecording(i);document.getElementById('stop'+i).onclick=()=>stopRecording(i);});
 document.getElementById('action').onclick=next;startClock();
}
function requestMic(){const s=document.getElementById('micstatus');const b=document.getElementById('micrequest');if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){s.textContent='This browser does not support microphone access.';return;}s.textContent='Requesting microphone access...';navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}).then(st=>{st.getTracks().forEach(t=>t.stop());s.innerHTML='<span class="success">✓ Microphone access granted.</span>';b.textContent='✓ Microphone enabled';}).catch(e=>{s.textContent='Microphone request failed: '+e.name+'. Please allow access in the browser and try again.';});}
function startRecording(i){if(state.recorder&&state.recorder.state==='recording'){alert('Finish the current recording first.');return;}const status=document.getElementById('rs'+i);navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}).then(stream=>{let mime='';['audio/webm;codecs=opus','audio/webm','audio/mp4'].some(m=>{if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m)){mime=m;return true;}});let rec;try{rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);}catch(e){status.textContent='Could not initialize recorder.';stream.getTracks().forEach(t=>t.stop());return;}state.recorder=rec;state.stream=stream;state.recordingIndex=i;state.recordSeconds=0;const chunks=[];status.textContent='Recording...';rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{clearInterval(state.recordTimer);const blob=new Blob(chunks,{type:rec.mimeType||mime||'audio/webm'});state.audioBlobs[i]=blob;state.speaking[i]={recorded:true,file:'speaking_'+(i+1)+(blob.type.includes('mp4')?'.mp4':'.webm'),durationSeconds:state.recordSeconds,mimeType:blob.type};const a=document.getElementById('pa'+i);a.src=URL.createObjectURL(blob);a.classList.remove('hidden');status.innerHTML='<span class="success">Recorded ('+state.recordSeconds+' seconds)</span>';stream.getTracks().forEach(t=>t.stop());state.recorder=null;state.stream=null;state.recordingIndex=null;};rec.start(250);state.recordTimer=setInterval(()=>{state.recordSeconds++;document.getElementById('rt'+i).textContent=fmt(state.recordSeconds);},1000);}).catch(e=>status.textContent='Microphone error: '+e.name);}
function stopRecording(i){if(state.recorder&&state.recorder.state==='recording'&&state.recordingIndex===i)state.recorder.stop();else alert('There is no active recording for this question.');}
function renderWriting(){let h=renderTop('Part 6 of 6 — Writing')+'<h2>Writing</h2><p class="muted">Write your responses in English. Focus on clarity, organization, grammar, vocabulary, and appropriate professional style.</p>';TEST.writing.forEach((w,i)=>{h+='<div class="question"><b>'+(i+1)+'. '+esc(w.prompt)+'</b><textarea id="w'+i+'" placeholder="Write your answer here..."></textarea><div id="wc'+i+'" class="word-count">0 words · Suggested range '+w.min+'–'+w.max+'</div></div>';});h+='<button id="action">Finish and Save Assessment</button>';app.innerHTML=h;TEST.writing.forEach((w,i)=>document.getElementById('w'+i).oninput=function(){const n=this.value.trim()?this.value.trim().split(/\s+/).length:0;document.getElementById('wc'+i).textContent=n+' words · Suggested range '+w.min+'–'+w.max;});document.getElementById('action').onclick=next;startClock();}
function flattenReading(){return TEST.reading.flatMap(p=>p.qs);}
function flattenListening(){return TEST.listening.flatMap(p=>p.qs);}
function next(){if(state.step===0){const c=document.getElementById('candidate').value.trim();if(!c){alert('Please enter the candidate name.');return;}state.candidate=c;state.startedAt=new Date().toISOString();state.step=1;}else if(state.step===1){state.grammar=collect('g',TEST.grammar.length);state.step=2;}else if(state.step===2){state.vocabulary=collect('v',TEST.vocabulary.length);state.step=3;}else if(state.step===3){state.reading=collect('r',15);state.step=4;}else if(state.step===4){state.listening=collect('l',15);state.step=5;}else if(state.step===5){TEST.speaking.forEach((_,i)=>{if(!state.speaking[i])state.speaking[i]={recorded:false,file:null,durationSeconds:0};});state.step=6;}else if(state.step===6){TEST.writing.forEach((_,i)=>state.writing[i]=document.getElementById('w'+i).value);finishAssessment();return;}render();window.scrollTo(0,0);}
function safeName(s){return String(s).trim().replace(/[^a-z0-9_-]+/gi,'_').replace(/^_+|_+$/g,'')||'candidate';}
async function finishAssessment(){clearInterval(state.countdown);app.innerHTML='<h2>Preparing your assessment file...</h2><p class="muted">Creating a ZIP with your answers and speaking recordings. Please wait.</p>';const grammarScore=scoreFlat(TEST.grammar,state.grammar),vocabScore=scoreFlat(TEST.vocabulary,state.vocabulary),readingScore=scoreFlat(flattenReading(),state.reading),listeningScore=scoreFlat(flattenListening(),state.listening);const objectiveCorrect=grammarScore.correct+vocabScore.correct+readingScore.correct+listeningScore.correct;const payload={version:'B2 Environmental English Practice Assessment — GitHub Pages',candidate:state.candidate,startedAt:state.startedAt,completedAt:new Date().toISOString(),durationSeconds:Math.min(state.timeLimit,Math.floor((Date.now()-new Date(state.startedAt).getTime())/1000)),timeLimitSeconds:3600,objectiveScores:{grammar:grammarScore,vocabulary:vocabScore,reading:readingScore,listening:listeningScore,total:{correct:objectiveCorrect,total:70,percent:Math.round(objectiveCorrect/70*100)}},answers:{grammar:state.grammar,vocabulary:state.vocabulary,reading:state.reading,listening:state.listening},speaking:state.speaking,writing:state.writing,evaluationNote:'Objective sections are automatically scored. Speaking and writing require qualitative evaluation for fluency, coherence, range, accuracy, pronunciation and task achievement.'};try{if(!window.JSZip)throw new Error('JSZip failed to load. Check your internet connection and try again.');const zip=new JSZip();zip.file('results.json',JSON.stringify(payload,null,2));for(const [i,blob] of Object.entries(state.audioBlobs)){const meta=state.speaking[i]||{};zip.file(meta.file||('speaking_'+(+i+1)+'.webm'),blob);}const data=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});const stamp=new Date().toISOString().replace(/[:.]/g,'-');const name='B2_English_Assessment_'+safeName(state.candidate)+'_'+stamp+'.zip';const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);complete(payload,name);}catch(err){app.innerHTML='<h2>Could not create ZIP</h2><div class="warning">'+esc(err.message)+'</div><button id="retry">Try again</button>';document.getElementById('retry').onclick=finishAssessment;}}
function complete(p,fileName){app.innerHTML='<h1>Assessment completed</h1><p class="success">✓ Your assessment ZIP has been downloaded to this device.</p><div class="info"><b>Objective score:</b> '+p.objectiveScores.total.correct+' / '+p.objectiveScores.total.total+' ('+p.objectiveScores.total.percent+'%)<br>Grammar: '+p.objectiveScores.grammar.percent+'% · Vocabulary: '+p.objectiveScores.vocabulary.percent+'% · Reading: '+p.objectiveScores.reading.percent+'% · Listening: '+p.objectiveScores.listening.percent+'%</div><p class="muted">File: '+esc(fileName||'assessment.zip')+'<br>Send this ZIP to your evaluator. Speaking and writing require qualitative language evaluation.</p>'; }
function render(){if(state.step===0)renderStart();else if(state.step===1)renderGrammar();else if(state.step===2)renderVocabulary();else if(state.step===3)renderReading();else if(state.step===4)renderListening();else if(state.step===5)renderSpeaking();else if(state.step===6)renderWriting();}
render();
})();
</script>
</body></html>
