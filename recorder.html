<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B2 Speaking Recorder</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;color:#1f2937;margin:0}.wrap{max-width:820px;margin:30px auto;background:#fff;padding:28px;border-radius:14px;box-shadow:0 2px 14px #0002}
button{border:0;border-radius:8px;padding:12px 18px;margin:8px 6px 8px 0;font-weight:bold;cursor:pointer;background:#2563eb;color:#fff}.secondary{background:#475569}.record{background:#b91c1c}.status{color:#64748b}.ok{color:#15803d;font-weight:bold}.hidden{display:none}.question{background:#f8fafc;border-left:4px solid #2563eb;padding:18px;margin:18px 0;border-radius:6px;line-height:1.55}.timer{color:#b91c1c;font-weight:bold}audio{width:100%;margin-top:10px}.warning{background:#fff7ed;border:1px solid #fed7aa;padding:12px;border-radius:8px;margin:12px 0}
</style></head>
<body><div class="wrap" id="app"></div>
<script>
const questions=[
"Introduce yourself. Describe your academic or professional background and explain what type of position you are interested in.",
"Describe a challenging situation you experienced at work, university, or during a project. Explain the situation, what you did, and the result.",
"Imagine that you are part of an environmental project and local residents disagree with part of the proposed plan. How would you approach the situation?",
"What environmental issue do you consider particularly important in your country or region? Explain the problem and suggest possible solutions.",
"Describe a time when you had to adapt to an unexpected change. What did you learn from the experience?",
"Why do you believe you would be a suitable candidate for a position as an Environmental Protection Specialist? Refer to relevant skills, knowledge, or personal qualities."
];
const session=new URLSearchParams(location.search).get('session')||'';
const recordings=[]; let micStream=null, recorder=null, active=-1, chunks=[], seconds=0, timer=null;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){
 let h='<h1>B2 English — Speaking Recorder</h1><p class="status">Complete all six recorded responses. This page will send them back to the main assessment automatically.</p>';
 h+='<div class="warning">Click <b>Enable microphone</b> first. Chrome should then display its normal permission popup.</div>';
 h+='<button id="enable">🎙 Enable microphone</button><span id="mic" class="status">Microphone not enabled.</span>';
 questions.forEach((q,i)=>{
  const done=!!recordings[i];
  h+='<div class="question"><b>Question '+(i+1)+' of 6</b><p>'+esc(q)+'</p>'+
  '<button class="secondary play" data-i="'+i+'">▶ Play question</button>'+
  '<button class="record start" data-i="'+i+'" '+(micStream?'':'disabled')+'>● Start recording</button>'+
  '<button class="secondary stop" data-i="'+i+'">■ Stop</button> <span class="timer" id="t'+i+'"></span>'+
  '<div id="s'+i+'" class="status">'+(done?'<span class="ok">✓ Recorded</span>':'Not recorded')+'</div>'+
  '<audio id="a'+i+'" controls '+(done?'':'class="hidden"')+'></audio></div>';
 });
 h+='<button id="finish" '+(recordings.filter(Boolean).length===6?'':'disabled')+'>✓ Send recordings and return</button>';
 document.getElementById('app').innerHTML=h;
 document.getElementById('enable').onclick=enable;
 document.querySelectorAll('.play').forEach(b=>b.onclick=()=>speak(questions[+b.dataset.i]));
 document.querySelectorAll('.start').forEach(b=>b.onclick=()=>start(+b.dataset.i));
 document.querySelectorAll('.stop').forEach(b=>b.onclick=()=>stop(+b.dataset.i));
 document.getElementById('finish').onclick=finish;
 recordings.forEach((r,i)=>{if(r){const a=document.getElementById('a'+i);a.src=r.dataUrl;a.classList.remove('hidden')}})
}
async function enable(){
 const el=document.getElementById('mic'); el.textContent='Requesting microphone access...';
 try{micStream=await navigator.mediaDevices.getUserMedia({audio:true});el.innerHTML='<span class="ok">✓ Microphone enabled.</span>';document.querySelectorAll('.start').forEach(b=>b.disabled=false)}
 catch(e){el.textContent='Microphone access was not granted: '+e.name+'. Check the browser permission and try again.'}
}
function speak(t){if(!speechSynthesis)return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.88;speechSynthesis.speak(u)}
function start(i){
 if(!micStream){enable();return} if(recorder&&recorder.state==='recording'){alert('Finish the current recording first.');return}
 active=i;chunks=[];seconds=0;const opts=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?{mimeType:'audio/webm;codecs=opus'}:{};
 recorder=new MediaRecorder(micStream,opts);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
 recorder.onstop=()=>{clearInterval(timer);const blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});const r=new FileReader();r.onloadend=()=>{recordings[i]={dataUrl:r.result,durationSeconds:seconds,mimeType:blob.type};render()};r.readAsDataURL(blob)};
 recorder.start(250);document.getElementById('s'+i).textContent='Recording...';timer=setInterval(()=>{seconds++;const x=document.getElementById('t'+i);if(x)x.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')},1000)
}
function stop(i){if(recorder&&recorder.state==='recording'&&active===i)recorder.stop();else alert('No active recording for this question.')}
function finish(){
 if(recordings.filter(Boolean).length!==6){alert('Please record all six responses first.');return}
 const payload={type:'B2_SPEAKING_COMPLETE',session:session,recordings:recordings};
 if(window.opener&&!window.opener.closed){window.opener.postMessage(payload,'*');document.getElementById('app').innerHTML='<h1>✓ Recordings sent</h1><p class="ok">You may now close this window and return to the main assessment.</p>'}
 else alert('The main assessment window is not available. Do not close this page; reopen the recorder from the assessment.');
}
render();
</script></body></html>
